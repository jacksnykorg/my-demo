apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      containers:
      - name: risk-service
        image: your-repo/risk-service:latest # IaC Finding: Use of 'latest' tag
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"